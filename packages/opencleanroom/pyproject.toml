[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "opencleanroom"
version = "0.1.0a1"
description = "Self-hosted SQL clean room: catalog, CLI, backends, console and endpoints over the cleanroom-sql library"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The OpenCleanroom Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
]
# The library at the same version (ADR 0009); in the monorepo it is installed editable from ../cleanroom-sql.
dependencies = [
    "cleanroom-sql==0.1.0a1",
    "duckdb==2.0.0",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "fastmcp==4.1.3",
]

[project.urls]
Source = "https://github.com/fprivitera/opencleanroom"
Issues = "https://github.com/fprivitera/opencleanroom/issues"
Security = "https://github.com/fprivitera/opencleanroom/security/policy"
Changelog = "https://github.com/fprivitera/opencleanroom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ui = ["streamlit==1.66.1"]
spark = ["pyspark-client==4.1.3"]  # Spark Connect client, pinned to the server line it is tested on (ADR 0007)
# A 4.x client cannot talk to a 3.5 server; the 3.5 line needs its own client, on pandas 2 and NumPy 1.
spark35 = ["pyspark[connect]==3.5.9", "pandas==2.3.3", "numpy==1.26.4", "pyarrow==17.0.0"]
test = ["pytest==9.1.1", "ruff==0.17.2", "httpx==0.28.1", "opencleanroom[ui]"]

[project.scripts]
opencleanroom = "opencleanroom.__main__:main"

[tool.setuptools]
packages = ["opencleanroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
