name: release

# Tag a green main commit `v<version>`: every package under packages/ is built and published
# to PyPI by Trusted Publishing (no stored token).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: build every package
        run: for p in packages/*/; do uv build "$p" --out-dir dist; done
      - name: every file carries the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in dist/*; do
            case "$f" in *"-$version-"*.whl | *"-$version.tar.gz") ;; *) echo "$f is not version $version"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
