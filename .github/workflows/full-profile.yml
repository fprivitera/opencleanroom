name: full sensitivity profile

on:
  workflow_dispatch:

jobs:
  full-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv venv --python 3.12 .venv
      - run: uv pip sync --python .venv/bin/python --require-hashes requirements/gates.txt
      - run: uv pip install --python .venv/bin/python --no-deps -e packages/cleanroom-sql
      - name: 1,000 examples per query shape
        working-directory: packages/cleanroom-sql
        run: CLEANROOM_SQL_HYPOTHESIS_PROFILE=full ../../.venv/bin/python -m pytest -q tests/test_sensitivity_property.py
